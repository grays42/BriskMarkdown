[package]
name = "brisk-markdown"
version = "0.1.0"
edition = "2021"
description = "A fast, lightweight Markdown notepad for Windows: opens instantly, renders cleanly, edits directly."
license = "MIT"
repository = "https://github.com/grays42/BriskMarkdown"
readme = "README.md"
keywords = ["markdown", "editor", "notepad", "windows", "viewer"]
categories = ["text-editors", "gui"]

[[bin]]
name = "BriskMarkdown"
path = "src/main.rs"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1.13"
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_Globalization",
    "Win32_Storage_Xps",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Security",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
